<rect x="728" y="180" width="204" height="70" rx="12" fill="#120A2B" stroke="#22D3EE" stroke-width="2"/>
<text x="830" y="223" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F8FAFC">Processing</text>
