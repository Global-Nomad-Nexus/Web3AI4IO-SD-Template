<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Three reproducible teaching pipelines</title>
<desc id="desc">Independent on-chain and off-chain pipelines feed joint integration. All bundled data and links are synthetic. Integration retains unmatched records and separates coverage from accuracy.</desc>
<rect width="1440" height="720" rx="28" fill="#080B1A"/>
<text x="56" y="65" font-family="sans-serif" font-size="34" font-weight="bold" fill="#F8FAFC">Two source contributions. One shared integration resource.</text>
<text x="56" y="105" font-family="sans-serif" font-size="20" fill="#AAB4D0">Independent acquisition, documentation and quality evidence for each component</text>
<text x="56" y="160" font-family="sans-serif" font-size="21" font-weight="bold" fill="#22D3EE">ON-CHAIN · Student A leads</text>
