<path d="M1054,255 V286 H1408 V454 H718 V480 M1054,405 V435 H718 V480" fill="none" stroke="#34D399" stroke-width="3"/>
<rect x="250" y="480" width="940" height="136" rx="18" fill="#071B27" stroke="#34D399" stroke-width="2"/>
<text x="720" y="519" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">INTEGRATION · Both authors lead</text>
<text x="720" y="556" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#F8FAFC">Pinned releases + relationship evidence + time and unit agreement</text>
<text x="720" y="590" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#AAB4D0">Retain unmatched records · Prevent row multiplication · Validate linkage separately</text>
<text x="56" y="671" font-family="sans-serif" font-size="21" font-weight="bold" fill="#FBBF24">SYNTHETIC TEACHING EXAMPLE — empirical source collection and scientific validation remain author work</text>
